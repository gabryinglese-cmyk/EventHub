spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventhub
    username: eventhub
    password: eventhub
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api